<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16213e">
  <meta name="description" content="Weekend weervoorspelling voor modelvliegen">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <title>Vliegweer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header id="app-header">
    <h1 class="app-title">Vliegweer</h1>
    <div id="location-bar">
      <span id="location-name">Locatie ophalen...</span>
      <button id="location-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        Wijzig
      </button>
    </div>
  </header>

  <!-- LOCATION MODAL -->
  <div id="location-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Locatie instellen</h2>
      <button id="use-gps-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 6px;">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2" x2="12" y2="6"/>
          <line x1="12" y1="18" x2="12" y2="22"/>
          <line x1="2" y1="12" x2="6" y2="12"/>
          <line x1="18" y1="12" x2="22" y2="12"/>
        </svg>
        Gebruik GPS-locatie
      </button>
      <div class="divider">of</div>
      <input type="text" id="location-input" placeholder="Plaatsnaam of 52.37, 4.89">
      <button id="save-location-btn">Opslaan</button>
      <button id="close-modal-btn">Annuleren</button>
    </div>
  </div>

  <!-- PULL TO REFRESH INDICATOR -->
  <div id="pull-indicator" class="pull-indicator">Vernieuwen...</div>

  <!-- MAIN CONTENT -->
  <main id="app-main">

    <!-- LOADING STATE -->
    <div id="loading" class="loading-container">
      <svg class="loading-airplane" viewBox="0 0 200 200" fill="currentColor">
        <g transform="translate(100,100)">
          <rect x="-10" y="-80" width="20" height="160" rx="10"/>
          <ellipse cx="0" cy="8" rx="90" ry="13"/>
          <ellipse cx="0" cy="-64" rx="35" ry="7"/>
          <rect x="-4" y="-88" width="8" height="28" rx="4"/>
          <ellipse cx="0" cy="84" rx="18" ry="4"/>
        </g>
      </svg>
      <div class="loading-text">Weerdata ophalen<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
    </div>

    <!-- ERROR STATE -->
    <div id="error-state" class="hidden">
      <p id="error-message"></p>
      <button id="retry-btn">Opnieuw proberen</button>
    </div>

    <!-- WEEKEND FORECAST -->
    <div id="forecast" class="hidden">

      <div id="day-cards"></div>

      <!-- LEGEND -->
      <div class="legend">
        <div class="legend-item">
          <span class="legend-dot" style="background: #4CAF50"></span>
          Uitstekend (75-100)
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: #FFC107"></span>
          Redelijk (50-74)
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: #FF9800"></span>
          Matig (25-49)
        </div>
        <div class="legend-item">
          <span class="legend-dot" style="background: #F44336"></span>
          Slecht (0-24)
        </div>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>Data: Open-Meteo.com | Laatst bijgewerkt: <span id="last-updated">--</span></p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
